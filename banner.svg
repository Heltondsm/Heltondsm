<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="60"  x2="900" y2="60"  stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="180" x2="900" y2="180" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  <line x1="225" y1="0" x2="225" y2="240" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  <line x1="450" y1="0" x2="450" y2="240" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  <line x1="675" y1="0" x2="675" y2="240" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>

  <!-- Bar chart decoration (right side) — data analyst theme -->
  <rect x="660" y="160" width="18" height="60" rx="3" fill="url(#bar1)"/>
  <rect x="686" y="135" width="18" height="85" rx="3" fill="url(#bar2)"/>
  <rect x="712" y="150" width="18" height="70" rx="3" fill="url(#bar1)"/>
  <rect x="738" y="110" width="18" height="110" rx="3" fill="url(#bar2)"/>
  <rect x="764" y="125" width="18" height="95" rx="3" fill="url(#bar1)"/>
  <rect x="790" y="95"  width="18" height="125" rx="3" fill="url(#bar2)"/>
  <rect x="816" y="80"  width="18" height="140" rx="3" fill="url(#bar1)"/>
  <rect x="842" y="60"  width="18" height="160" rx="3" fill="url(#bar2)"/>
  <rect x="868" y="70"  width="18" height="150" rx="3" fill="url(#bar1)"/>

  <!-- Trend line over bars -->
  <polyline
    points="669,200 695,178 721,193 747,152 773,168 799,137 825,122 851,101 877,115"
    stroke="#a5b4fc" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on trend line -->
  <circle cx="669" cy="200" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="695" cy="178" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="721" cy="193" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="747" cy="152" r="3" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="773" cy="168" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="799" cy="137" r="3" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="825" cy="122" r="3" fill="#a78bfa" opacity="0.9"/>
  <circle cx="851" cy="101" r="3" fill="#a78bfa" opacity="0.9"/>
  <circle cx="877" cy="115" r="3" fill="#8b5cf6" opacity="0.8"/>

  <!-- Left accent -->
  <rect x="0" y="0" width="5" height="240" fill="#6366f1" opacity="0.9"/>

  <!-- Main name -->
  <text x="44" y="108"
    font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif"
    font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Helton Dos Santos Moreira
  </text>

  <!-- Subtitle -->
  <text x="46" y="142"
    font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif"
    font-size="16" fill="#c4b5fd" letter-spacing="0.5">
    Data Analyst en formation  ·  10 ans Business &amp; E-commerce
  </text>

  <!-- Formation badge -->
  <rect x="46" y="162" width="220" height="26" rx="13" fill="#6366f1" opacity="0.2"/>
  <rect x="46" y="162" width="220" height="26" rx="13" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <text x="156" y="180"
    font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif"
    font-size="12" fill="#a5b4fc" text-anchor="middle" font-weight="500" letter-spacing="0.3">
    OpenClassrooms · Bachelor RNCP niv.6 · déc 2026
  </text>

  <!-- Bottom wave -->
  <path d="M0,205 Q150,190 300,205 Q450,220 600,205 Q750,190 900,205 L900,240 L0,240 Z"
    fill="#1e1b4b" opacity="0.5"/>
  <path d="M0,215 Q200,203 400,215 Q600,227 900,215 L900,240 L0,240 Z"
    fill="#312e81" opacity="0.4"/>
</svg>
